parameters:
- name: platform
  type: string
  values:
  - win-x64
  - linux-x64
  - osx-x64
  - osx-arm64
- name: pool
  type: object
- name: jobName
  type: string

jobs:
- job: ${{ parameters.jobName }}
  displayName: "[${{ parameters.platform }}] Build AppHostPatcher"
  pool:  ${{ parameters.pool }}
  templateContext:
    outputs:
    - output: pipelineArtifact
      displayName: 'Publish binaries'
      condition: always()
      continueOnError: True
      targetPath: $(AppHostPatcherRootDir)/${{ parameters.platform }}
      artifactName: 'apphostpatcher-${{ parameters.platform }}'

  steps:
  - checkout: self
    fetchDepth: 1
    fetchTags: false

  - template: /.azdo/common/use-latest-dotnet-sdk.yml@self

  - task: DotNetCoreCLI@2
    displayName: 'Build AppHostPatcher'
    inputs:
      command: 'build'
      projects: '$(Build.SourcesDirectory)/Public/Sdk/Public/Managed/Tools/AppHostPatcher'
      # --runtime is not optional here. Without it a self-contained build takes its runtime
      # identifier from the agent, so the osx-x64 leg silently started producing osx-arm64
      # binaries the moment the macos-latest image moved to Apple Silicon.
      arguments: '--configuration Release --runtime ${{ parameters.platform }} --output $(AppHostPatcherRootDir)/${{ parameters.platform }}'
